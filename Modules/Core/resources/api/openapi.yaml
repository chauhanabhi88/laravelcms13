openapi: 3.1.0
info:
  title: Marketplace Mobile API
  version: 1.0.0
  summary: Buyer REST API (v1) for the Android / iOS apps and the PWA.
  description: |
    Everything a buyer app needs: OTP sign-in, catalog, search, product pages, cart, checkout,
    payments, orders, tracking, returns, reviews, wishlist, notifications and reseller earnings.

    ## Envelope
    Every answer is JSON, including errors and 404/405/429 (never an HTML page).

    ```json
    { "success": true,  "code": 200, "message": "OK", "data": {}, "meta": { "pagination": {} } }
    { "success": false, "code": 422, "message": "The given data was invalid.", "errors": { "phone": ["..."] } }
    ```

    `code` is the HTTP status, or an app-specific code for the errors an app must handle in a
    particular way (see `ErrorCode`). `errors.reason` is a stable machine-readable string for domain
    failures (`price_changed`, `out_of_stock`, `cod_not_allowed`, ...).

    ## Conventions
    * JSON keys are `snake_case`; ids are integers (order and return numbers are strings).
    * Money is a decimal **string with two places** (`"249.00"`). The app formats it as ₹ with Indian
      digit grouping; `GET /app/config` gives the currency.
    * Timestamps are ISO-8601 with the UTC offset (`2026-10-29T10:15:00+05:30`); dates without a time
      (`expected_delivery_at`, `edd`) are `YYYY-MM-DD`.
    * Enums are lowercase strings.
    * Send `Accept: application/json`. When the server has API locales on, send `Accept-Language`
      (`en`, `hi`) or prefix the path with the locale.
    * `per_page` is capped at 50.

    ## Authentication
    1. `POST /customer/otp/send` with the phone number.
    2. `POST /customer/otp/verify` with the code and a `device_name`; the answer holds a bearer token
       (valid one year) with the `customer` scope. Send it as `Authorization: Bearer <token>`.
    3. `POST /customer/logout` revokes the token; `GET /customer/devices` lists signed-in devices and
       `DELETE /customer/devices/{id}` signs one out.

    Guests can browse and use the cart: the first `POST /cart/items` returns `meta.cart_token`, which the
    app sends as `X-Cart-Token` afterwards. Logging in merges the guest cart.

    ## Rate limits
    Per user (per IP when anonymous): 60 requests/minute in general, 120/minute for search and
    autocomplete, 10/minute for placing orders and starting payments. OTP: 5 sends/minute per phone and
    20/minute per IP. A limited call answers 429 with `Retry-After` (seconds) and `retry_after` in the body.

    ## Versioning
    Breaking changes ship as `/api/v2`. v1 only grows: new fields and endpoints may appear, so clients
    must ignore unknown fields. A deprecated field is marked `deprecated: true` here and the response
    carries a `Sunset` header.
  license:
    name: Proprietary
servers:
  - url: /api/v1
    description: Same host as the storefront
security:
  - bearerAuth: []
tags:
  - name: App
  - name: Auth
  - name: Account
  - name: Catalog
  - name: Search
  - name: Product
  - name: Wishlist
  - name: Cart
  - name: Checkout
  - name: Payment
  - name: Orders
  - name: Returns
  - name: Reviews
  - name: Notifications
  - name: Earnings

paths:
  /app/config:
    get:
      tags: [App]
      summary: Bootstrap data for the app
      description: Versions, currency, limits, payment key id, COD rules, delivery fee rules, support contacts. Public.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AppConfig' }

  # ---------------------------------------------------------------- Auth
  /customer/otp/send:
    post:
      tags: [Auth]
      summary: Send a login code
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                channel: { type: string, enum: [sms, email], default: sms }
                phone: { type: string, example: '9844455566' }
                email: { type: string, format: email, description: Only when channel is email and email OTP is enabled. }
      responses:
        '200':
          description: Code sent (or the previous one is still valid)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          channel: { type: string }
                          masked: { type: string, example: '+91 98XXX XX566' }
                          resend_in: { type: integer, description: Seconds before another code can be requested. }
                          expires_in: { type: integer, description: Seconds the code stays valid. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }
        '503':
          description: The SMS provider failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /customer/otp/verify:
    post:
      tags: [Auth]
      summary: Verify the code and get a token
      description: A new number is registered on its first successful verification (`data.new_customer`).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, device_name]
              properties:
                phone: { type: string }
                code: { type: string, example: '123456' }
                device_name: { type: string, example: Pixel 8 }
                device_token: { type: string, description: FCM registration token. }
                device_type: { type: string, enum: [android, ios, web] }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          token_type: { type: string, example: Bearer }
                          expires_in: { type: integer, description: Seconds until the token expires. }
                          new_customer: { type: boolean }
                          customer: { $ref: '#/components/schemas/Customer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }
  /customer/logout:
    post:
      tags: [Auth]
      summary: Revoke the current token
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /customer/devices:
    get:
      tags: [Auth]
      summary: Devices signed in to this account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /customer/devices/{id}:
    delete:
      tags: [Auth]
      summary: Sign a device out
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Account
  /customer/profile:
    get:
      tags: [Account]
      summary: The signed-in customer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Account]
      summary: Update the profile (send only the fields that change)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name: { type: string }
                last_name: { type: [string, 'null'] }
                email: { type: [string, 'null'], format: email }
                gender: { type: [string, 'null'] }
                date_of_birth: { type: [string, 'null'], format: date }
                preferred_locale: { type: [string, 'null'] }
                marketing_opt_in: { type: boolean }
                is_reseller: { type: boolean }
                reseller_business_name: { type: [string, 'null'] }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customer/addresses:
    get:
      tags: [Account]
      summary: Address book (default first)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Account]
      summary: Add an address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '201':
          description: Saved; `meta.serviceable` says whether the pincode is deliverable.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Address' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customer/addresses/{address}:
    parameters:
      - name: address
        in: path
        required: true
        schema: { type: integer }
    put:
      tags: [Account]
      summary: Update an address
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddressInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Address' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Account]
      summary: Delete an address
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '404': { $ref: '#/components/responses/NotFound' }
  /pincode/{pincode}:
    get:
      tags: [Account]
      summary: City and state of a pincode
      security: []
      parameters:
        - name: pincode
          in: path
          required: true
          schema: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Catalog
  /home:
    get:
      tags: [Catalog]
      summary: Home page sections (hero, banners, category tiles, collections)
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: string }
                            type: { type: string, enum: [hero, banner_row, category_tiles, collection, html_block, blog_posts, products_for_you] }
                            title: { type: [string, 'null'] }
                            subtitle: { type: [string, 'null'] }
                            data: { type: object, additionalProperties: true }
  /categories:
    get:
      tags: [Catalog]
      summary: Category tree
      security: []
      parameters:
        - name: depth
          in: query
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
  /categories/{slug}:
    get:
      tags: [Catalog]
      summary: A category with its trail, children, filterable attributes and defaults
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /brands:
    get:
      tags: [Catalog]
      summary: Brands (searchable)
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 60 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ---------------------------------------------------------------- Search
  /products:
    get:
      tags: [Search]
      summary: Search and browse with facets
      description: Page-based because facet counts need totals. `meta.pagination.has_more` drives infinite scroll.
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string }, description: Category slug }
        - { name: store, in: query, schema: { type: string }, description: Seller store slug }
        - { name: collection, in: query, schema: { type: string } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, newest, price_asc, price_desc, rating, discount] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: facets, in: query, schema: { type: boolean, default: true } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProductCard' }
                      facets: { type: [object, 'null'], additionalProperties: true }
        '429': { $ref: '#/components/responses/RateLimited' }
  /autocomplete:
    get:
      tags: [Search]
      summary: Suggestions while typing (2+ characters)
      security: []
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /recently-viewed:
    get:
      tags: [Search]
      summary: Cards for product ids the app remembers
      security: []
      parameters:
        - { name: ids, in: query, schema: { type: string, example: '12,45,78' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProductCard' }

  # ---------------------------------------------------------------- Product
  /products/{id}:
    get:
      tags: [Product]
      summary: Product page payload
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: variant, in: query, schema: { type: integer }, description: Preselect a variant }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}/similar:
    get:
      tags: [Product]
      summary: Similar products, or more from the same seller
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: type, in: query, schema: { type: string, enum: [similar, seller], default: similar } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ProductCard' }
        '404': { $ref: '#/components/responses/NotFound' }
  /products/{id}/reviews:
    get:
      tags: [Product, Reviews]
      summary: Published reviews with the rating summary
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: rating, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
        - { name: with_photos, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [helpful, latest] } }
        - { name: page, in: query, schema: { type: integer } }
        - { $ref: '#/components/parameters/PerPage' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /delivery-check:
    post:
      tags: [Product]
      summary: Serviceability, COD and delivery date for a pincode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, pincode]
              properties:
                product_id: { type: integer }
                variant_id: { type: [integer, 'null'] }
                pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- Wishlist
  /customer/wishlist:
    get:
      tags: [Wishlist]
      summary: Wishlist cards (24 per page)
      parameters:
        - { name: page, in: query, schema: { type: integer } }
      responses:
        '200':
          description: OK; `meta.product_ids` lists every wishlisted id so the app can paint hearts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Wishlist]
      summary: Add a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: integer }
      responses:
        '201': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /customer/wishlist/{product}:
    delete:
      tags: [Wishlist]
      summary: Remove a product
      parameters:
        - { name: product, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- Cart
  /cart:
    get:
      tags: [Cart]
      summary: The revalidated cart with totals
      description: Use `?cart=buy_now` for the single-item buy-now cart (customers only).
      security: [{ bearerAuth: [] }, { cartToken: [] }, {}]
      parameters:
        - { name: cart, in: query, schema: { type: string, enum: [standard, buy_now] } }
      responses:
        '200': { $ref: '#/components/responses/Cart' }
  /cart/items:
    post:
      tags: [Cart]
      summary: Add a variant
      security: [{ bearerAuth: [] }, { cartToken: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant_id]
              properties:
                variant_id: { type: integer }
                quantity: { type: integer, minimum: 1, default: 1 }
      responses:
        '201':
          description: Added. For a guest `meta.cart_token` holds the token to send as `X-Cart-Token`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '409': { $ref: '#/components/responses/OutOfStock' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /cart/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      tags: [Cart]
      summary: Change a line's quantity
      security: [{ bearerAuth: [] }, { cartToken: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1 }
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '409': { $ref: '#/components/responses/OutOfStock' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Cart]
      summary: Remove a line
      security: [{ bearerAuth: [] }, { cartToken: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/Cart' }
  /cart/buy-now:
    post:
      tags: [Cart]
      summary: Start a single-item checkout (signed-in customers)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variant_id]
              properties:
                variant_id: { type: integer }
                quantity: { type: integer, minimum: 1 }
      responses:
        '201':
          description: The buy-now cart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CartEnvelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/OutOfStock' }
  /cart/coupon:
    post:
      tags: [Cart]
      summary: Apply a coupon
      security: [{ bearerAuth: [] }, { cartToken: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, maxLength: 30 }
                payment_method: { type: string, enum: [cod, prepaid] }
      responses:
        '200': { $ref: '#/components/responses/Cart' }
        '422':
          description: The coupon cannot be applied; `reason` says why (expired, min_cart_value, ...).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Cart]
      summary: Remove the coupon
      security: [{ bearerAuth: [] }, { cartToken: [] }, {}]
      responses:
        '200': { $ref: '#/components/responses/Cart' }
  /cart/offers:
    get:
      tags: [Cart]
      summary: Coupons that could apply to this cart, with the saving each gives
      security: [{ bearerAuth: [] }, { cartToken: [] }, {}]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  # ---------------------------------------------------------------- Checkout
  /checkout/summary:
    post:
      tags: [Checkout]
      summary: Totals, serviceability and COD eligibility for an address and payment method
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CheckoutInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/CheckoutConflict' }
        '422': { $ref: '#/components/responses/CheckoutError' }
  /checkout/place:
    post:
      tags: [Checkout]
      summary: Place the order
      description: |
        `token` is a client-generated UUID: repeat it to retry safely (`data.already_placed: true`).
        Send `expected_total` (the summary's grand total) so a changed price answers `4091` instead of charging
        a different amount. `data.next_action` says what the app does next: `pay` (call
        `POST /orders/{orderNo}/payment`), `cod_otp` (call `POST /orders/{orderNo}/cod-otp/verify`) or `success`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/CheckoutInput'
                - type: object
                  required: [payment_method, token]
                  properties:
                    expected_total: { type: string, example: '998.00' }
                    channel: { type: string, enum: [android, ios, web] }
      responses:
        '201':
          description: Placed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order: { $ref: '#/components/schemas/Order' }
                          next_action: { type: string, enum: [pay, cod_otp, success] }
                          already_placed: { type: boolean }
                          payment: { type: [object, 'null'], additionalProperties: true }
        '200':
          description: The same token was used before; the existing order is returned.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/CheckoutConflict' }
        '422': { $ref: '#/components/responses/CheckoutError' }
        '429': { $ref: '#/components/responses/RateLimited' }

  # ---------------------------------------------------------------- Payment
  /orders/{orderNo}/payment:
    post:
      tags: [Payment]
      summary: Razorpay checkout options for the order's prepaid payment
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: Pass `data.checkout` to the Razorpay SDK.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Done' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /orders/{orderNo}/payment/verify:
    post:
      tags: [Payment]
      summary: Send the SDK's result (success or error) for server-side verification
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                razorpay_payment_id: { type: string }
                razorpay_order_id: { type: string }
                razorpay_signature: { type: string }
                error: { type: object, additionalProperties: true }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '202':
          description: The payment is still being confirmed; poll `GET /orders/{orderNo}`.
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{orderNo}/cod-otp/verify:
    post:
      tags: [Payment]
      summary: Confirm a COD order with the code sent by SMS
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: '123456' }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{orderNo}/cod-otp/resend:
    post:
      tags: [Payment]
      summary: Send the COD code again
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '429': { $ref: '#/components/responses/OtpRateLimited' }

  # ---------------------------------------------------------------- Orders
  /orders:
    get:
      tags: [Orders]
      summary: My orders, newest first
      description: Page-based by default; send `cursor=` (empty for the first page, then `meta.pagination.next_cursor`) for stable cursor paging.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /orders/{orderNo}:
    get:
      tags: [Orders]
      summary: One order with its packages
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order: { $ref: '#/components/schemas/Order' }
                          cancellable_item_ids: { type: array, items: { type: integer } }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{orderNo}/tracking:
    get:
      tags: [Orders]
      summary: Shipment timeline of each package
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{orderNo}/cancel:
    post:
      tags: [Orders]
      summary: Cancel items (or everything) before shipment
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                items: { type: array, items: { type: integer }, description: Order item ids; omit to cancel everything cancellable. }
                reason: { type: string }
                comment: { type: string, maxLength: 200 }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /orders/{orderNo}/invoice/{sellerOrder}:
    get:
      tags: [Orders]
      summary: A short-lived signed link to a package's tax invoice (PDF)
      parameters:
        - $ref: '#/components/parameters/OrderNo'
        - { name: sellerOrder, in: path, required: true, schema: { type: integer }, description: '`seller_orders[].id` of the order' }
      responses:
        '200':
          description: Open `data.url` in a viewer or download it; it needs no token and expires at `data.expires_at`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          url: { type: string, format: uri }
                          filename: { type: string }
                          expires_at: { type: string, format: date-time }
        '404': { $ref: '#/components/responses/NotFound' }
  /orders/{orderNo}/returnable-items:
    get:
      tags: [Returns]
      summary: Items that can still be returned or exchanged, with the reasons on offer
      parameters:
        - $ref: '#/components/parameters/OrderNo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Returns
  /returns:
    get:
      tags: [Returns]
      summary: My returns
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Return' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Returns]
      summary: Raise a return or exchange
      description: '`multipart/form-data`; `items` and `photos` use bracket syntax (`items[0][item_id]`, `photos[]`).'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [seller_order_id, type, reason_code, items]
              properties:
                seller_order_id: { type: integer }
                type: { type: string, enum: [return, exchange] }
                reason_code: { type: string }
                comment: { type: string, maxLength: 500 }
                items:
                  type: array
                  items:
                    type: object
                    required: [item_id, quantity]
                    properties:
                      item_id: { type: integer }
                      quantity: { type: integer }
                      exchange_variant_id: { type: [integer, 'null'] }
                photos:
                  type: array
                  items: { type: string, format: binary }
                pickup_address_id: { type: [integer, 'null'] }
                refund_mode: { type: string, enum: [bank, upi], description: Needed for COD orders. }
                vpa: { type: string }
                account_holder: { type: string }
                account_number: { type: string }
                account_number_confirmation: { type: string }
                ifsc: { type: string }
      responses:
        '201':
          description: Raised
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Return' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /returns/{returnNo}:
    parameters:
      - { name: returnNo, in: path, required: true, schema: { type: string } }
    get:
      tags: [Returns]
      summary: One return
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Return' }
        '404': { $ref: '#/components/responses/NotFound' }
  /returns/{returnNo}/cancel:
    post:
      tags: [Returns]
      summary: Cancel a return before pickup
      parameters:
        - { name: returnNo, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------- Reviews
  /reviews/mine:
    get:
      tags: [Reviews]
      summary: My reviews and the delivered items still waiting for one
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reviews:
    post:
      tags: [Reviews]
      summary: Review a delivered item (once per order item)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [order_item_id, rating]
              properties:
                order_item_id: { type: integer }
                rating: { type: integer, minimum: 1, maximum: 5 }
                title: { type: string }
                body: { type: string }
                photos:
                  type: array
                  items: { type: string, format: binary }
      responses:
        '201': { $ref: '#/components/responses/Done' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reviews/{id}/helpful:
    post:
      tags: [Reviews]
      summary: Toggle the "Helpful" vote
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Notifications
  /customer/notifications:
    get:
      tags: [Notifications]
      summary: In-app notifications, newest first
      description: Page-based by default; send `cursor=` for cursor paging. `meta.unread` is the badge count.
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /customer/notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark everything read
      responses:
        '200': { $ref: '#/components/responses/Done' }
  /customer/notifications/{id}/read:
    post:
      tags: [Notifications]
      summary: Mark one read
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '404': { $ref: '#/components/responses/NotFound' }
  /customer/device-tokens:
    post:
      tags: [Notifications]
      summary: Register the push (FCM) token of this install
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_token]
              properties:
                device_token: { type: string, minLength: 20, maxLength: 255 }
                device_type: { type: string, enum: [android, ios, web] }
      responses:
        '200': { $ref: '#/components/responses/Done' }
        '201': { $ref: '#/components/responses/Done' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Notifications]
      summary: Forget a push token (on logout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_token]
              properties:
                device_token: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Done' }

  # ---------------------------------------------------------------- Earnings
  /customer/earnings:
    get:
      tags: [Earnings]
      summary: Reseller wallet balances, history and withdrawals
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /customer/earnings/withdraw:
    post:
      tags: [Earnings]
      summary: Withdraw available earnings to UPI or a bank account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, refund_mode]
              properties:
                amount: { type: string, example: '500.00' }
                refund_mode: { type: string, enum: [bank, upi] }
                vpa: { type: string }
                account_holder: { type: string }
                account_number: { type: string }
                account_number_confirmation: { type: string }
                ifsc: { type: string }
      responses:
        '201': { $ref: '#/components/responses/Done' }
        '422': { $ref: '#/components/responses/ValidationError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal access token from `POST /customer/otp/verify` (scope `customer`).
    cartToken:
      type: apiKey
      in: header
      name: X-Cart-Token
      description: Guest cart token from `meta.cart_token`.

  parameters:
    OrderNo:
      name: orderNo
      in: path
      required: true
      schema: { type: string, example: ORD-2610-000123 }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 15 }

  responses:
    Done:
      description: OK
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    Cart:
      description: The cart and its totals
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CartEnvelope' }
    Unauthorized:
      description: Missing, expired or revoked token (code 4011)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed (wrong scope, blocked account, suspended seller 4031)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found (also used for another customer's order or return)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Invalid input; `errors` maps each field to its messages
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OutOfStock:
      description: "Out of stock (code 4092, errors.reason out_of_stock)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CheckoutConflict:
      description: A price changed (4091) or stock ran out (4092) since the summary; fetch the summary again
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    CheckoutError:
      description: Checkout cannot go on; `errors.reason` and `errors.step` say what to fix. COD not allowed is code 4221.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests; wait `Retry-After` seconds
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    OtpRateLimited:
      description: Too many OTP requests (code 4291); wait `Retry-After` seconds
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    ErrorCode:
      description: |
        App-specific envelope codes (config/api_codes.php). Any other `code` equals the HTTP status.
      type: integer
      enum: [4011, 4012, 4031, 4091, 4092, 4221, 4291]
      x-enum-descriptions:
        '4011': Token missing, expired or invalid (401)
        '4012': Token revoked (401)
        '4031': Seller suspended (403)
        '4091': Price changed at checkout (409)
        '4092': Out of stock (409)
        '4221': COD not eligible (422)
        '4291': OTP rate limit (429)
    Money:
      type: string
      pattern: '^-?[0-9]+\.[0-9]{2}$'
      description: Rupees with two decimal places.
      example: '249.00'
    Pagination:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        has_more: { type: boolean }
        next_cursor: { type: [string, 'null'] }
        total: { type: integer }
    Envelope:
      type: object
      required: [success, code, message]
      properties:
        success: { type: boolean, const: true }
        code: { type: integer, example: 200 }
        message: { type: string, example: OK }
        data: {}
        meta:
          type: object
          additionalProperties: true
          properties:
            pagination: { $ref: '#/components/schemas/Pagination' }
    Error:
      type: object
      required: [success, code, message]
      properties:
        success: { type: boolean, const: false }
        code:
          anyOf:
            - { type: integer, example: 422 }
            - { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        errors:
          type: object
          additionalProperties: true
          properties:
            reason: { type: string, example: price_changed }
        retry_after: { type: integer }
    Image:
      type: object
      properties:
        thumb: { type: string, format: uri }
        card: { type: string, format: uri }
        pdp: { type: string, format: uri }
        zoom: { type: string, format: uri }
    ProductCard:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        url: { type: string, format: uri }
        image: { type: [string, 'null'] }
        hover_image: { type: [string, 'null'] }
        price: { $ref: '#/components/schemas/Money' }
        mrp: { $ref: '#/components/schemas/Money' }
        discount_percent: { type: integer }
        rating: { type: [number, 'null'] }
        rating_count: { type: integer }
        free_delivery: { type: boolean }
        cod: { type: boolean }
        badge: { type: [string, 'null'] }
        in_stock: { type: boolean }
    ProductDetail:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        url: { type: string, format: uri }
        price: { $ref: '#/components/schemas/Money' }
        mrp: { $ref: '#/components/schemas/Money' }
        discount_percent: { type: integer }
        in_stock: { type: boolean }
        cod_allowed: { type: boolean }
        highlights: { type: array, items: { type: string } }
        description: { type: [string, 'null'] }
        specifications: { type: array, items: { type: object, additionalProperties: true } }
        manufacturer: { type: array, items: { type: object, additionalProperties: true } }
        returns:
          type: object
          properties:
            days: { type: integer }
            type: { type: string }
            summary: { type: string }
        brand: { type: [object, 'null'], additionalProperties: true }
        category: { type: array, items: { type: object, additionalProperties: true } }
        seller: { type: object, additionalProperties: true }
        axes: { type: array, items: { type: object, additionalProperties: true } }
        variants: { type: array, items: { type: object, additionalProperties: true } }
        images: { type: object, additionalProperties: true }
        default_variant_id: { type: [integer, 'null'] }
        size_chart: { type: [object, 'null'], additionalProperties: true }
        reviews: { type: object, additionalProperties: true }
        low_stock_threshold: { type: integer }
    CartLine:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: integer }
        variant_id: { type: integer }
        seller_id: { type: integer }
        name: { type: string }
        variant_label: { type: [string, 'null'] }
        sku: { type: [string, 'null'] }
        image: { type: [string, 'null'] }
        url: { type: string }
        quantity: { type: integer }
        max_quantity: { type: integer }
        price: { $ref: '#/components/schemas/Money' }
        mrp: { $ref: '#/components/schemas/Money' }
        line_total: { $ref: '#/components/schemas/Money' }
        cod_allowed: { type: boolean }
        saved_for_later: { type: boolean }
        purchasable: { type: boolean }
        issues:
          type: array
          items: { type: object, additionalProperties: true }
    Cart:
      type: object
      properties:
        id: { type: [integer, 'null'] }
        type: { type: string, enum: [standard, buy_now] }
        item_count: { type: integer }
        delivery_pincode: { type: [string, 'null'] }
        coupon_code: { type: [string, 'null'] }
        can_checkout: { type: boolean }
        cod_allowed: { type: boolean }
        groups:
          type: array
          description: One group per seller.
          items:
            type: object
            properties:
              seller_id: { type: integer }
              seller_name: { type: string }
              seller_url: { type: [string, 'null'] }
              edd_text: { type: [string, 'null'] }
              subtotal: { $ref: '#/components/schemas/Money' }
              lines:
                type: array
                items: { $ref: '#/components/schemas/CartLine' }
        unavailable:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
        saved_for_later:
          type: array
          items: { $ref: '#/components/schemas/CartLine' }
    CartTotals:
      type: object
      properties:
        item_count: { type: integer }
        total_mrp: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        subtotal: { $ref: '#/components/schemas/Money' }
        adjustments: { type: array, items: { type: object, additionalProperties: true } }
        delivery_charge: { $ref: '#/components/schemas/Money' }
        grand_total: { $ref: '#/components/schemas/Money' }
        you_save: { $ref: '#/components/schemas/Money' }
    CartEnvelope:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                cart: { $ref: '#/components/schemas/Cart' }
                totals: { $ref: '#/components/schemas/CartTotals' }
            meta:
              type: object
              properties:
                cart_token: { type: [string, 'null'] }
                max_qty_per_line: { type: integer }
    CheckoutInput:
      type: object
      required: [address_id]
      properties:
        cart: { type: string, enum: [standard, buy_now], default: standard }
        address_id: { type: integer }
        payment_method: { type: string, enum: [cod, prepaid] }
        reseller: { type: boolean }
        end_customer: { type: object, additionalProperties: true, description: "Name, phone and address of the end customer (reseller orders)." }
        prices: { type: object, additionalProperties: true, description: "Final customer price per cart line (reseller orders)." }
        token: { type: string, format: uuid }
    OrderItem:
      type: object
      properties:
        id: { type: integer }
        product_id: { type: integer }
        variant_id: { type: integer }
        name: { type: string }
        variant_label: { type: [string, 'null'] }
        sku: { type: [string, 'null'] }
        image: { type: [string, 'null'] }
        quantity: { type: integer }
        mrp: { $ref: '#/components/schemas/Money' }
        price: { $ref: '#/components/schemas/Money' }
        line_total: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        customer_price: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        status: { type: string }
        return_window_days: { type: integer }
        return_type: { type: string }
    SellerOrder:
      type: object
      properties:
        id: { type: integer, description: "Use with the invoice and returns endpoints." }
        sub_order_no: { type: string, example: ORD-2610-000123-1 }
        seller: { type: [string, 'null'] }
        status: { type: string }
        status_label: { type: string }
        subtotal: { $ref: '#/components/schemas/Money' }
        expected_delivery_at: { type: [string, 'null'], format: date }
        shipped_at: { type: [string, 'null'], format: date-time }
        delivered_at: { type: [string, 'null'], format: date-time }
        cancelled_at: { type: [string, 'null'], format: date-time }
        cancel_reason: { type: [string, 'null'] }
        has_invoice: { type: boolean }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItem' }
    Order:
      type: object
      properties:
        order_no: { type: string, example: ORD-2610-000123 }
        status: { type: string }
        status_label: { type: string }
        payment_method: { type: string, enum: [cod, prepaid] }
        payment_status: { type: string }
        items_count: { type: integer }
        total_mrp: { $ref: '#/components/schemas/Money' }
        discount: { $ref: '#/components/schemas/Money' }
        coupon_discount: { $ref: '#/components/schemas/Money' }
        delivery_charge: { $ref: '#/components/schemas/Money' }
        cod_fee: { $ref: '#/components/schemas/Money' }
        grand_total: { $ref: '#/components/schemas/Money' }
        is_reseller_order: { type: boolean }
        reseller_margin: { $ref: '#/components/schemas/Money' }
        placed_at: { type: string, format: date-time }
        shipping_address: { type: [object, 'null'], additionalProperties: true }
        seller_orders:
          type: array
          items: { $ref: '#/components/schemas/SellerOrder' }
    Return:
      type: object
      properties:
        return_no: { type: string }
        order_no: { type: string, description: The package (sub-order) number. }
        type: { type: string, enum: [return, exchange] }
        status: { type: string }
        status_label: { type: string }
        reason_code: { type: string }
        reason: { type: string }
        comment: { type: [string, 'null'] }
        refund_mode: { type: [string, 'null'] }
        refund_to: { type: [string, 'null'], description: "Masked UPI id or account." }
        refund_amount: { $ref: '#/components/schemas/Money' }
        refund_status: { type: [string, 'null'] }
        pickup_address: { type: [object, 'null'], additionalProperties: true }
        cancellable: { type: boolean }
        items: { type: array, items: { type: object, additionalProperties: true } }
        photos_count: { type: integer }
        tracking: { type: [object, 'null'], additionalProperties: true }
        created_at: { type: string, format: date-time }
        picked_up_at: { type: [string, 'null'], format: date-time }
        refunded_at: { type: [string, 'null'], format: date-time }
    Customer:
      type: object
      properties:
        id: { type: integer }
        first_name: { type: [string, 'null'] }
        last_name: { type: [string, 'null'] }
        display_name: { type: string }
        phone: { type: [string, 'null'] }
        phone_verified: { type: boolean }
        email: { type: [string, 'null'] }
        email_verified: { type: boolean }
        gender: { type: [string, 'null'] }
        date_of_birth: { type: [string, 'null'], format: date }
        preferred_locale: { type: [string, 'null'] }
        marketing_opt_in: { type: boolean }
        is_reseller: { type: boolean }
        reseller_business_name: { type: [string, 'null'] }
        has_password: { type: boolean }
        needs_profile: { type: boolean }
        created_at: { type: string, format: date-time }
    Address:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: string }
        address_line1: { type: string }
        address_line2: { type: string }
        landmark: { type: [string, 'null'] }
        pincode: { type: string }
        city: { type: object, properties: { id: { type: [integer, 'null'] }, name: { type: string } } }
        state: { type: object, properties: { id: { type: [integer, 'null'] }, name: { type: string } } }
        tag: { type: string, enum: [home, work, other] }
        is_default: { type: boolean }
        summary: { type: string }
    AddressInput:
      type: object
      required: [name, phone, address_line1, address_line2, pincode, tag]
      properties:
        name: { type: string, maxLength: 100 }
        phone: { type: string }
        address_line1: { type: string, maxLength: 200 }
        address_line2: { type: string, maxLength: 200 }
        landmark: { type: string, maxLength: 120 }
        pincode: { type: string, pattern: '^[1-9][0-9]{5}$' }
        tag: { type: string, enum: [home, work, other] }
        is_default: { type: boolean }
    Device:
      type: object
      properties:
        id: { type: string }
        name: { type: string, description: "The `device_name` sent when signing in." }
        scopes: { type: array, items: { type: string } }
        current: { type: boolean, description: True for the device making this call. }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, 'null'], format: date-time }
    AppConfig:
      type: object
      properties:
        app:
          type: object
          properties:
            name: { type: string }
            api_versions: { type: array, items: { type: string } }
            maintenance: { type: boolean }
            min_version: { type: object, properties: { android: { type: string }, ios: { type: string } } }
            latest_version: { type: object, properties: { android: { type: string }, ios: { type: string } } }
        currency:
          type: object
          properties:
            code: { type: string, example: INR }
            symbol: { type: string, example: ₹ }
            decimals: { type: integer }
        locale: { type: object, additionalProperties: true }
        limits: { type: object, properties: { per_page_max: { type: integer } } }
        payment:
          type: object
          properties:
            gateway: { type: string }
            razorpay_key_id: { type: [string, 'null'] }
            cod:
              type: object
              properties:
                enabled: { type: boolean }
                min_order_value: { $ref: '#/components/schemas/Money' }
                max_order_value: { $ref: '#/components/schemas/Money' }
                otp_threshold: { $ref: '#/components/schemas/Money' }
            payment_window_minutes: { type: integer }
        cart: { type: object, additionalProperties: true }
        customer: { type: object, additionalProperties: true }
        returns: { type: object, additionalProperties: true }
        support: { type: object, additionalProperties: true }
